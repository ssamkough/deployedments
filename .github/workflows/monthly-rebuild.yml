name: Monthly rebuild

# Deployment data is collected at build time, so the site only changes when it is rebuilt.
# This asks Netlify to rebuild on the 1st of every month (and on demand from the Actions tab).
on:
  schedule:
    - cron: '0 9 1 * *' # 09:00 UTC on the 1st
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Netlify build hook
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::error::NETLIFY_BUILD_HOOK_URL secret is not set"
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL" > /dev/null
          echo "Build requested."
